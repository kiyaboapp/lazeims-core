[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lazeims-central-api"
version = "0.1.0"
description = "LAZEIMS Central API — FastAPI system of record (auth, registry, exams, collection, sync intake, closeout)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27",
    "sqlalchemy[asyncio]>=2.0.25,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "openpyxl>=3.1",
    "lazeims-common",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
    "greenlet>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

# During development, lazeims-common is a path dependency. We install it with:
#   pip install -e ../lazeims-common
# then `pip install -e .[dev]` for this package. (setuptools has no native
# path-dependency syntax; the editable install above wires it up.)
